<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="GUID-4bd9d353-8451-45c1-861f-5e76379b78fa" class="topic concept glossentry" lang="en_US"><div class="breadcrumbs"><div><div><a href="">Glossary</a></div><div><a href="contents/glossentries/rc-servo">RC servo</a></div></div></div><div class="title title glossterm">RC servo</div><div class="abstract abstract glossdef"><div><div><span>RC servos are small-scale electric motors with integrated position or speed control. The position of an RC servo is usually controlled via pulse-width modulation.</span></div></div></div><h2 class="title title glossShortForm">servo</h2></body></html>
