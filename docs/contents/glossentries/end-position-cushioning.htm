<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="GUID-4616267d-88f4-4651-810d-be5b32dde6e4" class="topic concept glossentry" lang="en_US"><div class="breadcrumbs"><div><div><a href="">Glossary</a></div><div><a href="contents/glossentries/end-position-cushioning">End-position cushioning</a></div></div></div><div class="title title glossterm">End-position cushioning</div><div class="abstract abstract glossdef"><div><div><span>Damping mechanism on pneumatic actuators to slow down the movement before hitting internal stops. End-position cushioning prevents damage to the actuators at high speeds.</span></div></div></div></body></html>
