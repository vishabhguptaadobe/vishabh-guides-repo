<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="GUID-c42d07e9-2b78-496f-8034-51b7743da2a8" class="topic concept glossentry" lang="en_US"><div class="breadcrumbs"><div><div><a href="">Glossary</a></div><div><a href="contents/glossentries/stepper-motor">Stepper motor</a></div></div></div><div class="title title glossterm">Stepper motor</div><div class="abstract abstract glossdef"><div><div><span>Stepper motors are brushless DC motors where the rotation is divided into discrete steps. Stepper motors do not require a position sensor or feedback loops to move accurately to a position.</span></div></div></div><h2 class="title title glossShortForm">stepper</h2></body></html>
