<!--?xml version="1.0" encoding="utf-8" ?--><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><link rel="stylesheet" type="text/css" href="../../_rhdefault.css"></head><body id="GUID-0bec3f75-3223-4f05-b157-52187f110be2" class="topic reference" lang="en_US"><div class="breadcrumbs"><div><div><a href="">Description</a></div><div><a href="contents/topics/overview-of-components">Overview of components</a></div></div></div><h1 class="title">Overview of components</h1><div class="shortdesc"><div><div><span>Components of the gantry robot and their function.</span></div></div></div><figure id="fig_2" class="fig"><figcaption class="title"><span class="prefix-content">Figure: </span>Components of the gantry robot</figcaption><span class="placement-break align-"><img src="../images/components.svg" alt="" id="image_2" class="image" data-attr-placement="break"></span><div class="table-headcount-0"><div><div>1</div><div>Stepper motor</div><div>Drives the carriage.</div></div><div><div>2</div><div>Mounting bracket</div><div>Supports the stepper motor.</div></div><div><div>3</div><div>Coupling</div><div>Connects the stepper motor to the leadscrew.</div></div><div><div>4</div><div>Limit switch</div><div>Senses reference position of stepper motor.</div></div><div><div>5</div><div>Carriage</div><div>Moves the gripper horizontally.</div></div><div><div>6</div><div>Cylinder mounting plate</div><div>Connects the cylinder to the carriage.</div></div><div><div>7</div><div>Leadscrew</div><div>Converts the rotational motion of the stepper motor into the translational movement of the carriage.</div></div><div><div>8</div><div>Pneumatic proximity switches</div><div>Senses the position of the piston rod of the cylinder.</div></div><div><div>9</div><div>Piston rod cylinder</div><div>Moves the gripper vertically.</div></div><div><div>10</div><div>Servo mounting plate</div><div>Connects the RC servo to the piston rod cylinder.</div></div><div><div>11</div><div>RC servo</div><div>Rotates the gripper.</div></div><div><div>12</div><div>Pneumatic gripper</div><div>Moves the gripper jaws.</div></div><div><div>13</div><div>Gripper jaws</div><div>Hold the item.</div></div><div><div>14</div><div>Columns</div><div>Support structure.</div></div></div></figure></body></html>
